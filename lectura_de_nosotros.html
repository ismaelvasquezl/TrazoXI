<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap');
  :root{--bg0:#0a0d11;--bg1:#0e1319;--panel:#151b22;--panel2:#1b222b;--panel3:#212a34;--gold:#ffd21f;--gold2:#e8bd00;--gold-ink:#0a0d11;

  *{box-sizing:border-box}
  body{margin:0;font-family:var(--f-body);color:var(--txt);line-height:1.5;background:radial-gradient(1200px 700px at 18% -8%,#14202c 0,#0d131a 52%,#090c10 100%) fixed}

  a{color:var(--teal);text-decoration:none}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}

  .stickytop{position:sticky;top:0;z-index:40}

  h2{font-size:22px;margin:6px 0 2px;display:flex;align-items:center;gap:9px}h2::before{content:"";width:6px;height:20px;background:var(--gold);border-radius:3px}

  .chart-wrap{position:relative;height:260px}

  .vdef{display:flex;flex-direction:column;gap:5px;margin-top:10px}

  .pnode:hover circle{filter:brightness(1.25)}
  .xirow{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line)}

  .xin{font-family:var(--f-display);font-size:14px;font-weight:700;color:var(--white);margin-bottom:3px}

  .bcard:hover{border-color:var(--line-gold);transform:translateY(-2px)}

  .msb2{background:var(--bg1);border:1px solid var(--line-strong);color:var(--mut);border-radius:9px;padding:7px 12px;font-size:12.5px;font-weight:600;cursor:pointer}.msb2.on{background:var(--gold);color:#000;border-color:var(--gold)}
  .scroll-x{overflow-x:auto}
  table.mt{width:100%;border-collapse:collapse;font-size:12.5px;min-width:560px;margin-top:6px}
  table.mt caption{text-align:left;font-family:var(--f-display);font-weight:800;color:var(--white);padding:4px 0 8px;font-size:15px}
  table.mt th{background:var(--panel3);color:var(--gold);font-family:var(--f-display);text-transform:uppercase;letter-spacing:.4px;font-size:11px;padding:7px 9px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line-gold)}
  table.mt th:first-child,table.mt td:first-child{text-align:left}
  table.mt th.sortable{cursor:pointer}table.mt th.sorted{color:#fff}
  table.mt td{padding:6px 9px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
  table.mt tr:hover td{background:rgba(255,255,255,.03)}
  table.mt tr.tot td{background:rgba(255,210,0,.08);font-weight:700;border-top:1px solid var(--line-gold)}
  table.mt tr.dim td{color:var(--mut2)} .na{color:var(--mut2)} .na-note{font-size:11.5px;color:var(--mut2);margin-top:8px}
  #pmsel2{background:var(--bg1);border:1px solid var(--line-strong);color:var(--white);padding:9px 12px;border-radius:10px;font-size:14px;max-width:360px}

  /* ===== Insights por sección ===== */
  .insights{border-color:var(--line-gold)}
  .ingrid{display:grid;gap:12px}@media(min-width:720px){.ingrid{grid-template-columns:1fr 1fr 1fr}}
  .insub .inh{font-family:var(--f-display);font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;margin:2px 0 6px;display:flex;align-items:center;gap:6px}

  /* ===== Responsive móvil (evita el "pegado" y el scroll horizontal) ===== */

<body>
<div class="stickytop">
<header><div class="hin"><div class="brand"><span class="crest"></span>LECTURA DE NOSOTROS · COQUIMBO UNIDO <span style="color:var(--mut);font-size:10px;font-weight:700;letter-spacing:1px;margin-left:4px">por TrazoXI</span></div><a class="back" href="index_conapi.html">← Dashboard</a></div></header>
<nav class="tabs"><div class="tabsin" id="tabs">
  <button class="tab active" data-v="resumen">Resumen</button>
  <button class="tab" data-v="GK">Arqueros</button>
  <button class="tab" data-v="DEF">Defensas</button>
  <button class="tab" data-v="LAT">Laterales</button>
  <button class="tab" data-v="VOL">Volantes</button>
  <button class="tab" data-v="DEL">Delanteros</button>
  <button class="tab" data-v="campo">Campo</button>
  <button class="tab" data-v="metricas">Métricas</button>
  <button class="tab" data-v="fases">Por fase</button>
  <button class="tab" data-v="mapas">Mapas</button>
</div></nav>
</div>
<main>
  <section class="view active" id="v-resumen"></section>
  <section class="view" id="v-GK"></section>
  <section class="view" id="v-DEF"></section>
  <section class="view" id="v-LAT"></section>
  <section class="view" id="v-VOL"></section>
  <section class="view" id="v-DEL"></section>
  <section class="view" id="v-campo"></section>
  <section class="view" id="v-metricas"></section>
  <section class="view" id="v-fases"></section>
  <section class="view" id="v-mapas"></section>
</main>
<div class="ov" id="ov"><div class="modal" id="modalBox"></div></div>
<script>
(function(){
'use strict';
const N=NOSOTROS, $=s=>document.querySelector(s), esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const charts={}; const destroy=k=>{if(charts[k]){charts[k].destroy();delete charts[k];}};
const GRPLABEL={GK:'Arqueros',DEF:'Defensas (centrales)',LAT:'Laterales',VOL:'Volantes',DEL:'Delanteros'};
const CHIP={GK:'gk',DEF:'def',LAT:'lat',VOL:'vol',DEL:'del'};

function pcard(p){
  const m=[];
  m.push(['Min',p.min+"'"]); m.push(['PJ',p.pj]);
  if(p.grupo==='DEL'){ m.push(['Goles',p.g]); m.push(['xG',p.xg]); m.push(['Remates',p.tiros+'/'+p.tirosArco]); }
  else if(p.grupo==='VOL'){ if(p.g)m.push(['Goles',p.g]); m.push(['xG',p.xg]); m.push(['xA',p.xa]); if(p.pases)m.push(['Pases %',p.pasesPct+'%']); }
  else if(p.grupo==='LAT'){ m.push(['xA',p.xa]); if(p.pases)m.push(['Pases',p.pases]); m.push(['Pases %',p.pasesPct+'%']); }
  else if(p.grupo==='DEF'){ if(p.pases)m.push(['Pases',p.pases]); m.push(['Pases %',p.pasesPct+'%']); }
  else { m.push(['Altura',p.alt+'cm']); }
  const hasPM=!!(window.NOSOTROS_PM&&NOSOTROS_PM.jug[String(p.d)]&&NOSOTROS_PM.jug[String(p.d)].some(x=>x));
  return `<div class="pc${hasPM?' clk':''}"${hasPM?` data-pm="${p.d}"`:''}><div class="hd"><div class="dor num">${p.d}</div>
     <div><div class="nm">${esc(p.n)}</div><div class="meta"><span class="chip ${CHIP[p.grupo]}">${p.pos}</span> · ${p.edad?p.edad+' años':'—'}${p.alt?' · '+p.alt+'cm':''}</div></div></div>
     <div class="mg">${m.map(x=>`<div class="m"><b class="num">${x[1]}</b>${x[0]}</div>`).join('')}</div>
     <div class="nota">${esc(p.nota)}</div>${hasPM?'<div class="expand">▸ Click: línea de los 5 partidos</div>':''}</div>`;
}

/* ================= DESPLIEGUE POR JUGADOR · 5 PARTIDOS ================= */
const PM = window.NOSOTROS_PM||{partidos:[],jug:{}};
const pmState={d:null,off:{},metric:'auto'};
// ejes del radar segun grupo (clave de dato, etiqueta, formateo)
const AXES={
  DEF:[['pases','Pases'],['pasesPct','Pase %'],['duPct','Duelos %'],['rec','Recuperados'],['perdInv','Pocas pérdidas']],
  LAT:[['pases','Pases'],['pasesPct','Pase %'],['xa','xA'],['duPct','Duelos %'],['rec','Recuperados']],
  VOL:[['pases','Pases'],['pasesPct','Pase %'],['xa','xA'],['xg','xG'],['duPct','Duelos %'],['rec','Recuperados']],
  DEL:[['xg','xG'],['tiros','Remates'],['toq','Toques área'],['xa','xA'],['regOk','Regates'],['duPct','Duelos %']],
  GK:[['savePct','Save %'],['paradas','Paradas'],['pasesPct','Distrib. %'],['pasesLejos','Juego largo'],['salidas','Salidas'],['gcInv','Portería']]
};

function renderVdef(p,serie){
  const played=serie.map((r,i)=>r?Object.assign({},r,{_i:i,_m:PM.partidos[i]}):null).filter(Boolean);
  if(!played.length){$('#pmVdef').innerHTML='';return;}
  const avg=k=>played.reduce((s,r)=>s+(+r[k]||0),0)/played.length;
  const best=(k,dir)=>played.slice().sort((a,b)=>dir*((+b[k]||0)-(+a[k]||0)))[0];
  const V=[],D=[];
  if(p.grupo==='GK'){
    const sumPar=played.reduce((s,r)=>s+r.paradas,0), sumGC=played.reduce((s,r)=>s+r.gc,0), sumTC=played.reduce((s,r)=>s+r.tirosContra,0);
    const svOv=sumPar+sumGC>0?Math.round(sumPar/(sumPar+sumGC)*100):null;
    if(svOv!=null)(svOv>=70?V:D).push(`Save% global en los 5: ${svOv}% (${sumPar} paradas, ${sumGC} goles de ${sumTC} tiros a puerta).`);
    const dist=played.filter(r=>r.pases>=15);
    if(dist.length){const mnP=Math.min(...dist.map(r=>r.pasesPct)),mxP=Math.max(...dist.map(r=>r.pasesPct));
      if(mnP>=80)V.push(`Distribución fiable con balón (nunca baja del ${mnP}% con volumen).`);
      else if(mxP-mnP>=20)D.push(`Distribución irregular entre partidos (${mnP}%–${mxP}%): depende de la presión rival.`);}
    const bl=best('pasesLejos',1); if(bl.pasesLejos>=20)V.push(`Asume juego largo cuando toca: ${bl.pasesLejosC}/${bl.pasesLejos} (${bl.pasesLejosPct}%) vs ${bl._m.rival}.`);
    const sumSal=played.reduce((s,r)=>s+r.salidas,0);
    if(sumSal>=6)V.push(`Activo en salidas/cruces: ${sumSal} salidas en la muestra.`);
    else if(sumSal<=1)D.push(`Pocas salidas (${sumSal}): juego de área más bien conservador, revisar en balón parado y centros.`);
    const bgc=best('gc',1); if(bgc.gc>=3)D.push(`Partido más exigido vs ${bgc._m.rival}: ${bgc.gc} goles recibidos de ${bgc.tirosContra} tiros.`);
    const cs=played.filter(r=>r.gc===0).length; if(cs>=1)V.push(`${cs} valla(s) invicta(s) en la muestra.`);
    if(!V.length)V.push('Rendimiento regular sin picos destacados en la muestra.');
    if(!D.length)D.push('Sin debilidades marcadas partido a partido en la muestra.');
    $('#pmVdef').innerHTML=V.slice(0,4).map(t=>`<div class="vd v"><span class="ic">✓</span><span>${esc(t)}</span></div>`).join('')
      +D.slice(0,3).map(t=>`<div class="vd d"><span class="ic">▲</span><span>${esc(t)}</span></div>`).join('');
    return;
  }
  // virtudes/defectos segun grupo
  if(p.grupo==='DEL'||p.grupo==='VOL'){
    const sx=played.reduce((s,r)=>s+r.xg,0), sg=played.reduce((s,r)=>s+r.g,0);
    if(sx>=0.6&&sg<sx-0.4)D.push(`Definición por debajo del xG: ${sg} gol(es) para ${sx.toFixed(2)} xG acumulado en estos partidos.`);
    if(sg>=sx)V.push(`Eficiencia de cara al gol: ${sg} gol(es) rinde por encima de su xG (${sx.toFixed(2)}).`);
    const bx=best('xg',1); if(bx.xg>=0.4)V.push(`Mayor peligro vs ${bx._m.rival} (${bx.xg} xG, ${bx.tiros} remates).`);
    const bt=best('toq',1); if(p.grupo==='DEL'&&bt.toq>=5)V.push(`Fija y ataca el área: ${bt.toq} toques de área vs ${bt._m.rival}.`);
  }
  if(p.grupo==='VOL'||p.grupo==='LAT'){
    const bxa=best('xa',1); if(bxa.xa>=0.2)V.push(`Pico de creación vs ${bxa._m.rival} (${bxa.xa} xA).`);
  }
  // pase: consistencia
  const pcts=played.filter(r=>r.pases>=10).map(r=>r.pasesPct);
  if(pcts.length){const mn=Math.min(...pcts),mx=Math.max(...pcts);
    if(mn>=80)V.push(`Fiabilidad en el pase sostenida (nunca baja del ${mn}% con volumen).`);
    else if(mx-mn>=20)D.push(`Precisión de pase irregular entre partidos (${mn}%–${mx}%): sensible al rival/contexto.`);}
  // duelos
  const bd=best('duPct',1), wd=best('duPct',-1);
  if(bd.duInt>=5&&bd.duPct>=65)V.push(`Fuerte en el duelo vs ${bd._m.rival} (${bd.duOk}/${bd.duInt}, ${bd.duPct}%).`);
  if(wd.duInt>=6&&wd.duPct<=35)D.push(`Sufre en el duelo vs ${wd._m.rival} (${wd.duOk}/${wd.duInt}, ${wd.duPct}%).`);
  // perdidas (def/lat/vol)
  if(p.grupo!=='DEL'){const bp=best('perd',1); if(bp.perd>=15)D.push(`Pico de pérdidas vs ${bp._m.rival} (${bp.perd}).`);}
  if(!V.length)V.push('Rendimiento regular sin picos destacados en la muestra.');
  if(!D.length)D.push('Sin debilidades marcadas partido a partido en la muestra.');
  $('#pmVdef').innerHTML=V.slice(0,3).map(t=>`<div class="vd v"><span class="ic">✓</span><span>${esc(t)}</span></div>`).join('')
    +D.slice(0,3).map(t=>`<div class="vd d"><span class="ic">▲</span><span>${esc(t)}</span></div>`).join('');
}

function pitchSVG(layer){
  if(!layer)return''; const z=N.zonas,W=300,H=460,mx=12,my=12,pw=W-2*mx,ph=H-2*my,cols=3,bands=6,cw=pw/cols,bh=ph/bands;let cells='';
  if(layer.grid){const red=(layer.color==='red'||layer.tipo==='red');const base=red?[255,95,95]:[255,210,31];
    for(let b=0;b<bands;b++)for(let c=0;c<cols;c++){const v=layer.grid[b][c],x=mx+c*cw,y=my+(bands-1-b)*bh,a=(v*0.82).toFixed(2);
      cells+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${cw.toFixed(1)}" height="${bh.toFixed(1)}" fill="rgba(${base[0]},${base[1]},${base[2]},${a})"/>`;
      if(v>=0.5)cells+=`<text x="${(x+cw/2).toFixed(1)}" y="${(y+bh/2+4).toFixed(1)}" text-anchor="middle" font-size="11" fill="#06131f" font-weight="800">${Math.round(v*100)}</text>`;}}
  let net='';
  if(layer.tipo==='weakdef'&&z.defensores){z.defensores.forEach(n=>{
    if(n.aer==null){net+=`<circle cx="${n.x}" cy="${n.y}" r="10" fill="#9aa7b2" fill-opacity=".3" stroke="#9aa7b2" stroke-width="2"/><text x="${n.x}" y="${n.y-13}" text-anchor="middle" font-size="9" fill="#fff" font-weight="700">${n.d}</text><text x="${n.x}" y="${n.y+3.5}" text-anchor="middle" font-size="8" fill="#fff">ref.aérea</text>`;return;}
    const col=n.aer<=35?'#ff5f5f':n.aer<=50?'#f5a623':'#38d98a';const r=n.aer<=35?15:n.aer<=50?12:10;
    net+=`<circle cx="${n.x}" cy="${n.y}" r="${r}" fill="${col}" fill-opacity=".30" stroke="${col}" stroke-width="2.5"/><text x="${n.x}" y="${n.y-r-3}" text-anchor="middle" font-size="9" fill="#fff" font-weight="700">${n.d}</text><text x="${n.x}" y="${n.y+3.5}" text-anchor="middle" font-size="9" fill="#fff" font-weight="800">${n.aer}%</text>`;});}
  const lines=`<rect x="${mx}" y="${my}" width="${pw}" height="${ph}" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1.5"/><line x1="${mx}" y1="${my+ph/2}" x2="${mx+pw}" y2="${my+ph/2}" stroke="rgba(255,255,255,.22)"/><circle cx="${W/2}" cy="${my+ph/2}" r="30" fill="none" stroke="rgba(255,255,255,.22)"/><rect x="${W/2-46}" y="${my}" width="92" height="52" fill="none" stroke="rgba(255,255,255,.28)"/><rect x="${W/2-46}" y="${my+ph-52}" width="92" height="52" fill="none" stroke="rgba(255,255,255,.28)"/>`;
  return `<svg class="pitch fx-lens" viewBox="0 0 ${W} ${H}" style="width:100%;max-width:290px;background:linear-gradient(180deg,#123a1a,#0c2c13);border-radius:10px;border:1px solid var(--line-strong)">${cells}${lines}${net}<text x="${W-16}" y="20" font-size="9" fill="rgba(255,255,255,.65)" text-anchor="end">▲ ataque</text></svg>`;
}

      <div class="grid g2" style="margin-top:8px"><div style="text-align:center">${pitchSVG(lay('transiciones'))}<div class="sub">Recuperaciones / transición</div></div><div style="text-align:center">${pitchSVG(lay('perdidas'))}<div class="sub">Pérdidas de balón</div></div></div></div>

    <div class="callout info">${esc(N.confianza)}</div>`;
}

/* ================= CAMPO (fortalezas/debilidades) + MÉTRICAS (tablas) ================= */
const WYA=(function(){try{const A=(typeof WY_ACUM!=='undefined')?WY_ACUM:window.WY_ACUM;return A.equipos['Coquimbo Unido'];}catch(e){return null;}})();
function pmAgg(d){const a=(PM.jug&&PM.jug[String(d)])||[];const s={duOk:0,duInt:0,rec:0,perd:0,regOk:0,toq:0,paradas:0,gc:0,tc:0};
  a.forEach(r=>{if(!r)return;s.duOk+=r.duOk||0;s.duInt+=r.duInt||0;s.rec+=r.rec||0;s.perd+=r.perd||0;s.regOk+=r.regOk||0;s.toq+=r.toq||0;s.paradas+=r.paradas||0;s.gc+=r.gc||0;s.tc+=r.tirosContra||0;});
  s.duPct=s.duInt?Math.round(s.duOk/s.duInt*100):null;s.savePct=(s.paradas+s.gc)?Math.round(s.paradas/(s.paradas+s.gc)*100):null;return s;}
function aerOf(p){const Dd=(N.zonas&&N.zonas.defensores)||[];const f=Dd.find(x=>x.d===p.d||(x.n&&p.n.indexOf(x.n)>=0));return f&&f.aer!=null?f.aer:null;}
function ficha(p){const s=pmAgg(p.d),per90=p.min?90/p.min:0,F=[],D=[];
  if(p.pasesPct!=null){if(p.pasesPct>=84&&p.pases>=80)F.push('Salida limpia ('+p.pasesPct+'%)');else if(p.pasesPct<=63&&p.pases>=60)D.push('Pase arriesgado ('+p.pasesPct+'%)');}
  if(s.duPct!=null&&s.duInt>=15){if(s.duPct>=60)F.push('Fuerte en duelo ('+s.duPct+'%)');else if(s.duPct<=42)D.push('Flojo en duelo ('+s.duPct+'%)');}
  const aer=aerOf(p);if(aer!=null){if(aer>=55)F.push('Fuerte aéreo ('+aer+'%)');else if(aer<=40)D.push('Débil aéreo ('+aer+'%)');}
  if(s.rec*per90>=4&&p.grupo!=='DEL')F.push('Recuperador ('+s.rec+')');
  if(s.regOk>=8)F.push('Desequilibrio 1v1 ('+s.regOk+' regates)');
  if(s.perd*per90>=16)D.push('Pierde mucho ('+s.perd+')');
  if(p.xa>=0.6)F.push('Creación (xA '+p.xa+')');
  if(p.grupo==='DEL'||p.grupo==='VOL'){
    if(s.toq>=18&&p.grupo==='DEL')F.push('Amenaza de área ('+s.toq+' toques)');
    if(p.xg>=0.8){if(p.g>=p.xg)F.push('Definidor ('+p.g+'g/'+p.xg+'xG)');else if(p.g<=p.xg-0.6)D.push('Definición floja ('+p.g+'g/'+p.xg+'xG)');}
    if(p.tiros>=8&&p.tirosArco/p.tiros<=0.3)D.push('Puntería ('+p.tirosArco+'/'+p.tiros+' al arco)');
  }
  if(p.grupo==='GK'){if(s.savePct!=null)F.push('Save% '+s.savePct);if(p.pasesPct>=80)F.push('Distribución fiable ('+p.pasesPct+'%)');}
  return {F,D,rating:F.length-D.length};}
const XI=[{pos:'GK',x:170,y:430},{pos:'LB',x:54,y:338},{pos:'LCB',x:126,y:368},{pos:'RCB',x:214,y:368},{pos:'RB',x:286,y:338},{pos:'LDMF',x:126,y:266},{pos:'RDMF',x:214,y:266},{pos:'AMF',x:170,y:190},{pos:'LAMF',x:54,y:172},{pos:'RAMF',x:286,y:172},{pos:'CF',x:170,y:84}];
const SLOTGRP={GK:'GK',LB:'LAT',RB:'LAT',LCB:'DEF',RCB:'DEF',LDMF:'VOL',RDMF:'VOL',AMF:'VOL',LAMF:'VOL',RAMF:'VOL',CF:'DEL'};
function pickXI(){const used=new Set(),out=[];XI.forEach(sl=>{let c=N.players.filter(p=>p.pos===sl.pos&&!used.has(p.d));if(!c.length)c=N.players.filter(p=>p.grupo===SLOTGRP[sl.pos]&&!used.has(p.d));c.sort((a,b)=>b.min-a.min);const p=c[0];if(p){used.add(p.d);out.push({sl,p});}});return out;}
const rcol=r=>r>=1?'#38d98a':r===0?'#f5a623':'#ff5f5f';
function renderCampo(){const xi=pickXI();const W=340,H=490,mx=14,my=14,pw=W-2*mx,ph=H-2*my;
  const lines=`<rect x="${mx}" y="${my}" width="${pw}" height="${ph}" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="1.5"/><line x1="${mx}" y1="${my+ph/2}" x2="${mx+pw}" y2="${my+ph/2}" stroke="rgba(255,255,255,.16)"/><circle cx="${W/2}" cy="${my+ph/2}" r="36" fill="none" stroke="rgba(255,255,255,.16)"/><rect x="${W/2-54}" y="${my}" width="108" height="56" fill="none" stroke="rgba(255,255,255,.2)"/><rect x="${W/2-54}" y="${my+ph-56}" width="108" height="56" fill="none" stroke="rgba(255,255,255,.2)"/>`;
  const nodes=xi.map(({sl,p})=>{const f=ficha(p),c=rcol(f.rating),ln=esc(p.n.split(' ').slice(-1)[0]);
    return `<g class="pnode" data-pm="${p.d}" style="cursor:pointer"><circle cx="${sl.x}" cy="${sl.y}" r="18" fill="${c}26" stroke="${c}" stroke-width="2.5"/><text x="${sl.x}" y="${sl.y+5}" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" font-family="Barlow Condensed">${p.d}</text><text x="${sl.x}" y="${sl.y+31}" text-anchor="middle" font-size="9.5" fill="#dfe6ec" font-weight="700">${ln}</text>${f.F[0]?`<text x="${sl.x}" y="${sl.y-24}" text-anchor="middle" font-size="8" fill="#5fe0a0">✓ ${esc(f.F[0].split(' (')[0])}</text>`:''}${f.D[0]?`<text x="${sl.x}" y="${sl.y+43}" text-anchor="middle" font-size="8" fill="#ff7b7b">▲ ${esc(f.D[0].split(' (')[0])}</text>`:''}</g>`;}).join('');
  const svg=`<svg class="pitch" viewBox="0 0 ${W} ${H}" style="width:100%;max-width:430px;background:linear-gradient(180deg,#123a1a,#0c2c13);border-radius:12px;border:1px solid var(--line-strong)">${lines}${nodes}<text x="${W-14}" y="22" font-size="9" fill="rgba(255,255,255,.6)" text-anchor="end">▲ ataque</text></svg>`;
  const list=xi.map(({sl,p})=>{const f=ficha(p);const tags=f.F.map(x=>`<span class="tg f">✓ ${esc(x)}</span>`).join('')+f.D.map(x=>`<span class="tg d">▲ ${esc(x)}</span>`).join('');
    return `<div class="xirow pc clk" data-pm="${p.d}" style="cursor:pointer"><div class="xidor" style="border-color:${rcol(f.rating)}">${p.d}</div><div style="flex:1"><div class="xin">${esc(p.n)} <span class="sub" style="font-size:10px">${esc(p.pos)} · ${p.min}'</span></div>${tags||'<span class="sub" style="font-size:11px">sin señales marcadas en la muestra</span>'}</div></div>`;}).join('');
  const xiIds=new Set(xi.map(x=>x.p.d));
  const subs=N.players.filter(p=>!xiIds.has(p.d)&&p.min>0).sort((a,b)=>b.min-a.min).slice(0,8);
  const bench=subs.map(p=>{const f=ficha(p);const t=(f.F[0]?`<span class="tg f">✓ ${esc(f.F[0])}</span>`:'')+(f.D[0]?`<span class="tg d">▲ ${esc(f.D[0])}</span>`:'');
    return `<div class="bcard pc clk" data-pm="${p.d}"><div class="bhd"><span class="xidor" style="width:26px;height:26px;font-size:12px;border-color:${rcol(f.rating)}">${p.d}</span><span class="bn">${esc(p.n)}<span class="sub" style="font-size:9px;display:block;font-weight:400">${esc(p.pos)} · ${p.min}' · ${p.pj} PJ</span></span></div><div class="btg">${t||'<span class="sub" style="font-size:10px">muestra corta</span>'}</div></div>`;}).join('');
  $('#v-campo').innerHTML=`<h2>Campo · fortalezas y debilidades</h2>
    <p class="sub">Once tipo por posición (más minutos de la muestra) + banco con los suplentes clave. El color del dorsal resume el balance (verde = más fortalezas, ámbar = equilibrio, rojo = más debilidades). Toca cualquier jugador para ver su línea de 6 partidos. [DATO] volúmenes Hudl · [INFERENCIA] el umbral fuerte/flojo.</p>
    <div class="callout warn" style="border-left:4px solid var(--amber);background:rgba(245,166,35,.08);padding:9px 13px;border-radius:0 9px 9px 0;font-size:13px;margin-bottom:10px">⚠ Bajas para el próximo partido (vs Ñublense, 25-10): <b>Nicolás Johansen</b> (goleador, golpes ante Colo-Colo) y <b>Elvis Hernández</b>. La referencia de área pasa a Riveros / Pratto.</div>
    <div class="grid g2" style="align-items:start"><div style="text-align:center">${svg}
      <div style="display:flex;gap:12px;justify-content:center;margin-top:8px;font-size:11px;flex-wrap:wrap"><span style="color:#38d98a">● fortalezas ></span><span style="color:#f5a623">● equilibrio</span><span style="color:#ff5f5f">● debilidades ></span></div></div>
      <div class="card" style="margin:0"><h3 style="margin-top:0">Detalle del once</h3>${list}</div></div>
    <div class="card" style="margin-top:12px"><h3 style="margin-top:0">Banco · suplentes clave <span class="sub" style="font-size:11px;font-weight:400">(${subs.length} con más minutos fuera del once)</span></h3><div class="benchgrid">${bench}</div></div>`;
}
/* ---- MÉTRICAS (tablas) ---- */
let metSub='equipo', aggSort={k:'min',dir:-1};
function fxm(v,suf){return (v==null||v===''||(typeof v==='number'&&isNaN(v)))?'<span class="na">—</span>':(v+(suf||''));}
function renderMetricas(){
  $('#v-metricas').innerHTML=`<h2>Métricas · tablas comparables</h2>
    <div class="metnav">${[['equipo','Equipo · por partido'],['agg','Jugadores · agregado'],['jug','Jugador · partido a partido']].map(x=>`<button class="msb2 ${metSub===x[0]?'on':''}" data-m="${x[0]}">${x[1]}</button>`).join('')}</div><div id="metout"></div>`;
  $('#v-metricas').querySelectorAll('.msb2').forEach(b=>b.onclick=()=>{metSub=b.dataset.m;renderMetricas();});
  if(metSub==='equipo')metEquipo();else if(metSub==='agg')metAgg();else metJug();
}
function metEquipo(){const o=$('#metout');if(!WYA){o.innerHTML='<p class="sub">No se cargó wyscout_acumulado.js.</p>';return;}
  const P=WYA.partidos,T=WYA.totales;
  const C=[['Rival',r=>esc(r.rival)+' <span class="sub">('+r.loc+')</span>'],['GF-GA',r=>r.gf+'-'+r.ga],['xG',r=>fxm(r.xg)],['xGA',r=>fxm(r.xga)],['Pos%',r=>fxm(r.pos,'%')],['PPDA',r=>fxm(r.ppda)],['Duelos%',r=>fxm(r.duelos,'%')],['Pase%',r=>fxm(r.pasePct,'%')],['Tiros/Arco',r=>fxm(r.tiros)+(r.arco!=null?'/'+r.arco:'')],['Pérd.',r=>fxm(r.perd)],['Recup.',r=>fxm(r.rec)],['Ancho',r=>fxm(r.ancho,' m')],['Largo',r=>fxm(r.largo,' m')]];
  const head='<tr>'+C.map(c=>`<th>${c[0]}</th>`).join('')+'</tr>';
  const rows=P.map(r=>'<tr>'+C.map(c=>`<td>${c[1](r)}</td>`).join('')+'</tr>').join('');
  const tot=`<tr class="tot"><td>TOTAL/PROM · ${T.pj} PJ</td><td>${T.gf}-${T.ga}</td><td>${T.xg} (${T.xgPJ}/p)</td><td>${fxm(T.xga)}</td><td>${fxm(T.pos,'%')}</td><td>${fxm(T.ppda)}</td><td>${fxm(T.duelos,'%')}</td><td>${fxm(T.pasePct,'%')}</td><td>${fxm('—')}</td><td>${T.perdPJ}/p</td><td>${T.recPJ}/p</td><td>${fxm(T.ancho,' m')}</td><td>${fxm(T.largo,' m')}</td></tr>`;
  o.innerHTML=`<div class="scroll-x"><table class="mt">${head}${rows}${tot}</table></div><p class="na-note">"—": el formato «Informe Partido» de los 5 primeros no publica xGA / posesión / PPDA / ancho-largo a nivel equipo; solo el «Informe de Equipo» (Colo-Colo) los trae. [DATO Wyscout]</p>`;
}
function metAgg(){const o=$('#metout');
  const C=[['n','Jugador',p=>'#'+p.d+' '+esc(p.n)],['pos','Pos',p=>esc(p.pos)],['pj','PJ',p=>p.pj],['min','Min',p=>p.min],['g','G',p=>p.g],['xg','xG',p=>p.xg],['a','A',p=>p.a],['xa','xA',p=>p.xa],['tiros','Tiros/Arco',p=>p.tiros+'/'+p.tirosArco],['pases','Pases',p=>fxm(p.pases)],['pasesPct','Pase%',p=>fxm(p.pasesPct,'%')]];
  const ps=N.players.slice().sort((a,b)=>{let va=a[aggSort.k],vb=b[aggSort.k];if(typeof va==='string'||typeof vb==='string')return aggSort.dir*(''+(va||'')).localeCompare(''+(vb||''));va=va==null?-Infinity:va;vb=vb==null?-Infinity:vb;return aggSort.dir*(va-vb);});
  const head='<tr>'+C.map(c=>`<th class="sortable ${aggSort.k===c[0]?'sorted':''}" data-k="${c[0]}">${c[1]}${aggSort.k===c[0]?(aggSort.dir<0?' ▼':' ▲'):''}</th>`).join('')+'</tr>';
  o.innerHTML=`<div class="sub" style="margin-bottom:4px">22 jugadores · click en el encabezado para ordenar</div><div class="scroll-x"><table class="mt">${head}${ps.map(p=>'<tr>'+C.map(c=>`<td>${c[2](p)}</td>`).join('')+'</tr>').join('')}</table></div>`;
  o.querySelectorAll('th.sortable').forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(aggSort.k===k)aggSort.dir*=-1;else{aggSort.k=k;aggSort.dir=(k==='n'||k==='pos')?1:-1;}metAgg();});
}
function metJug(){const o=$('#metout');const ps=N.players.slice().sort((a,b)=>b.min-a.min);
  o.innerHTML=`<div style="margin:6px 0 10px"><select id="pmsel2">${ps.map(p=>`<option value="${p.d}">#${p.d} ${esc(p.n)} · ${esc(p.pos)}</option>`).join('')}</select></div><div id="metjbody"></div>`;
  const go=()=>metJugTable(+$('#pmsel2').value);$('#pmsel2').onchange=go;go();
}
function metJugTable(d){const p=N.players.find(x=>x.d===d),serie=PM.jug[String(d)]||[],parts=PM.partidos,gk=p.grupo==='GK';
  const C=gk?[['Partido',(r,m)=>esc(m.rival)+' ('+m.loc+') '+m.res],['Min',r=>fxm(r.min,"'")],['GC',r=>fxm(r.gc)],['Paradas',r=>r.paradas!=null?r.paradas+'/'+(r.tirosContra!=null?r.tirosContra:'—'):'<span class="na">—</span>'],['Save%',r=>r.savePct!=null?r.savePct+'%':'<span class="na">—</span>'],['Distribución',r=>r.pases!=null?r.pasesC+'/'+r.pases+' '+r.pasesPct+'%':'<span class="na">—</span>'],['J. largo',r=>r.pasesLejos!=null?r.pasesLejosC+'/'+r.pasesLejos+' '+r.pasesLejosPct+'%':'<span class="na">—</span>'],['Salidas',r=>fxm(r.salidas)],['Cesiones',r=>fxm(r.cesion)]]
   :[['Partido',(r,m)=>esc(m.rival)+' ('+m.loc+') '+m.res],['Min',r=>fxm(r.min,"'")],['G',r=>fxm(r.g)],['xG',r=>fxm(r.xg)],['A',r=>fxm(r.a)],['xA',r=>fxm(r.xa)],['Tiros/Arco',r=>r.tiros+'/'+r.arco],['Pases',r=>r.pasesC+'/'+r.pases+' '+r.pasesPct+'%'],['Regates',r=>r.regOk+'/'+r.regInt],['Duelos%',r=>r.duOk+'/'+r.duInt+' '+r.duPct+'%'],['Pérd.',r=>fxm(r.perd)],['Recup.',r=>fxm(r.rec)],['Toques área',r=>fxm(r.toq)]];
  const head='<tr>'+C.map(c=>`<th>${c[0]}</th>`).join('')+'</tr>';let rows='';
  parts.forEach((m,i)=>{const r=serie[i];if(!r){rows+=`<tr class="dim"><td>${esc(m.rival)} (${m.loc}) ${m.res}</td><td colspan="${C.length-1}" class="na">no disputó / sin detalle</td></tr>`;return;}rows+='<tr><td>'+C[0][1](r,m)+'</td>'+C.slice(1).map(c=>`<td>${c[1](r)}</td>`).join('')+'</tr>';});
  $('#metjbody').innerHTML=`<div class="scroll-x"><table class="mt"><caption>#${p.d} ${esc(p.n)} · ${esc(p.pos)}</caption>${head}${rows}</table></div>`;
}
